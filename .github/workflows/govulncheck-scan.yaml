name: Govulncheck Security Scan

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    runs-on: lab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          sudo apt-get install -y --no-install-recommends jq

      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        env:
          CGO_ENABLED: "0"
        run: |
          govulncheck -tags containers_image_openpgp,containers_image_storage_stub -show verbose ./...

      - name: Generate SARIF file
        if: always()
        env:
          CGO_ENABLED: "0"
        run: govulncheck -tags containers_image_openpgp,containers_image_storage_stub -format=sarif ./... > govulncheck.sarif

      # govulncheck emits identical call stacks twice for some stdlib results,
      # which the SARIF schema (uniqueItems) rejects on upload, so dedupe them.
      - name: Dedupe call stacks in SARIF
        if: always()
        run: |
          jq '.runs[].results[] |= (if .stacks then .stacks |= unique else . end)' \
            govulncheck.sarif > govulncheck-deduped.sarif

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: govulncheck-deduped.sarif
          category: govulncheck

      - name: Fail if vulnerabilities found
        if: steps.govulncheck.outcome == 'failure'
        run: |
          found=$(jq -r '[.runs[]?.results[]?.ruleId | select(. != null and . != "")] | unique | .[]' \
            govulncheck-deduped.sarif)

          if [ -n "$found" ]; then
            echo "Vulnerabilities found:"
            echo "$found"
            exit 1
          fi
          echo "govulncheck failed but reported no findings"

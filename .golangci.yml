version: "2"

# Migrated from golangci-lint v1.64.8 keeping the v1 coverage. Everything the upgraded or new checks report on the
# current code is disabled below with a TODO. Plan to enable them, roughly cheapest first (issue counts as of v2.15.0):
#
#   1. Linters with no issues on the current code: nilnesserr, exptostd, fatcontext, mirror, iface, sloglint,
#      gochecksumtype, iotamixing
#   2. staticcheck QF* quickfix checks (new in v2): 80 issues, auto-fixable with `just lint-fix`
#   3. goconst detection in composite literals: 55 issues
#   4. Linting tests and the release tests helpers: 134 issues, see linters.exclusions.paths
#   5. Default exclusions inherited from v1, see linters.exclusions.presets
#   6. nolintlint require-explanation: 765 directives without explanation
#   7. Linters with issues on the current code: modernize (45), intrange (26), wastedassign (7), canonicalheader (8),
#      forcetypeassert (16), recvcheck (3), nosprintfhostport (2), dupword (3), gomoddirectives (1), godoclint (29),
#      perfsprint (217), forbidigo (23, needs settings as it forbids fmt.Print* by default)
#   8. goconst detection in function call arguments: 531 issues, needs evaluation as it may be too noisy
#
# Complexity and line length linters (cyclop, funlen, gocognit, gocyclo, maintidx, nestif, lll, ...) aren't planned.

run:
  # kept from the v1 config, v2 has no timeout by default
  timeout: 10m
  allow-parallel-runners: true
  build-tags:
    - containers_image_openpgp
    - containers_image_storage_stub

linters:
  default: none
  # Look at this for details: https://golangci-lint.run/docs/linters/
  enable:
    # enabled by default
    - errcheck
    - govet
    - ineffassign
    - staticcheck # includes gosimple and stylecheck since v2
    - unused
    # disabled by default
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - copyloopvar
    - ginkgolinter
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - err113
    - goprintffuncname
    - gosec
    - importas
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    # Not planned: conflicts with the K8s API conventions (e.g. fabricatorAPI instead of fabricatorApi) and external
    # APIs field names, 40 issues
    # - tagliatelle
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck

  settings:
    exhaustive:
      check:
        - switch
        - mapliteral # renamed from map in v2
    goconst:
      exclude-types:
        # TODO evaluate detection in function call arguments (v1 and v2 default to skip it): 531 issues
        - Call
        # TODO enable detection in composite literals added in goconst v1.11.0 (v1 had v1.7.1): 55 issues
        - CompositeLit
    govet:
      enable-all: true
      disable:
        # Not planned: optimizes struct memory layout at the cost of readable fields order, 128 issues
        - fieldalignment
        # Not planned: reports the idiomatic err shadowing, 229 of 239 issues are about err
        - shadow
    importas:
      no-unaliased: true
      alias:
        - pkg: k8s.io/apimachinery/pkg/types
          alias: ktypes
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: kmetav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: kapierrors
        - pkg: k8s.io/apimachinery/pkg/util/errors
          alias: kerrors
        - pkg: k8s.io/apimachinery/pkg/api/meta
          alias: kmeta
        - pkg: sigs.k8s.io/controller-runtime/pkg/log
          alias: kctrllog
        - pkg: sigs.k8s.io/yaml
          alias: kyaml
        - pkg: sigs.k8s.io/controller-runtime
          alias: kctrl
        - pkg: sigs.k8s.io/controller-runtime/pkg/client
          alias: kclient
    depguard:
      rules:
        main:
          deny:
            - pkg: "github.com/pkg/errors$"
              desc: use stdlib errors package
            - pkg: "golang.org/x/exp/maps$"
              desc: use stdlib maps or samber/lo package
            - pkg: "golang.org/x/exp/slices$"
              desc: use stdlib slices or samber/lo package
            - pkg: "golang.org/x/exp/slog$"
              desc: use stdlib slog package
            - pkg: "k8s.io/utils/strings/slices$"
              desc: use stdlib slices or samber/lo package
            - pkg: gopkg.in/yaml
              desc: use sigs.k8s.io/yaml
            - pkg: go.githedgehog.com/fabric/pkg/agent
              desc: don't import fabric agent package
    predeclared:
      # v1 behavior, v2 defaults to shadow only
      mode:
        - declare
        - shadow
    reassign:
      patterns:
        - ".*"
    revive:
      # By default, revive will enable only the linting rules that are named in the configuration file.
      # So, it's needed to explicitly enable all required rules here.
      rules:
        # The following rules are recommended https://github.com/mgechev/revive#recommended-configuration
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: package-naming # split out of var-naming in revive v1.15.0, v1 had v1.7.0
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        #
        # Rules in addition to the recommended configuration above.
        #
        - name: bool-literal-in-expr
        - name: constant-logical-expr
    staticcheck:
      # v1 ran all checks of staticcheck, gosimple and stylecheck while v2 defaults skip ST1000, ST1003, ST1016,
      # ST1020, ST1021 and ST1022 (the ones about comments are still excluded by the comments preset)
      checks:
        - all
        # TODO enable quickfix checks (new in v2): 80 issues, QF1012 x73, QF1003 x6, QF1008 x1
        - -QF*

  exclusions:
    # v1 default, v2 defaults to strict
    generated: lax
    # Default exclusions in v1 (exclude-use-default: true)
    presets:
      # TODO enable: 124 issues about missing or malformed doc comments, staticcheck ST1000/ST1020/ST1021/ST1022
      # (also revive exported and package-comments rules that aren't enabled)
      - comments
      # TODO enable: 53 issues, gosec G204 subprocess launched with variable x17, G304 file inclusion via variable x36
      # (also G103 unsafe calls, no issues)
      - common-false-positives
      # TODO enable: 45 issues, gosec G104 unhandled errors (duplicates errcheck) x21, G301/G302 dir/file permissions
      # x24 (also govet unsafe.Pointer and staticcheck SA4011, no issues)
      - legacy
      # TODO enable: 154 issues, errcheck on Close, Flush, os.Remove(All), fmt.Print*, os.(Un)Setenv and std streams
      - std-error-handling
    paths:
      # TODO remove: matches any path containing test, so the tests (18 issues, usetesting is effectively disabled
      # until then) and the release tests in pkg/hhfab (116 issues in testing.go) aren't linted
      - test
      # Not planned: third-party code
      - vendor

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    # v1 default, v2 defaults to strict
    generated: lax
    paths:
      # Not planned: third-party code
      - vendor

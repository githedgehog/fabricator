version: "2"

# Migrated from golangci-lint v1.64.8 keeping the v1 coverage. Everything the upgraded or new checks report on the
# current code is disabled below with a TODO. Plan to enable them, roughly cheapest first (issue counts as of v2.15.0):
#
#   1. staticcheck QF* quickfix checks (new in v2): 80 issues, auto-fixable with `just lint-fix`
#   2. goconst detection in composite literals: 55 issues
#   3. Linting tests and the release tests helpers: 134 issues, see linters.exclusions.paths
#   4. Default exclusions inherited from v1, see linters.exclusions.presets
#   5. nolintlint require-explanation: 765 directives without explanation
#   6. Linters with issues on the current code: modernize (166, auto-fixable, incl. 107 embedlit for Go 1.27 promoted
#      fields in composite literals and 3 omitzero disabled by controller-runtime and kubebuilder), intrange (26),
#      forcetypeassert (16), godoclint (29), perfsprint (217), forbidigo (23, needs settings as it forbids fmt.Print*
#      by default)
#   7. Stricter sloglint options: msg-style capitalized (22), static-msg (26), key-naming-case camel (52) or snake
#      (79), args-on-sep-lines (293), no-raw-keys (671)
#   8. goconst detection in function call arguments: 531 issues, needs evaluation as it may be too noisy
#   9. More revive rules (from kubebuilder): unused-parameter (11, mostly to be renamed to _), import-shadowing (12,
#      4 of them are the scoped loggers named slog)
#
# Complexity and line length linters (cyclop, funlen, gocognit, gocyclo, maintidx, nestif, lll, ...) aren't planned.
# wastedassign isn't planned either as ineffassign already reports the lost values, it only adds the zero value
# initializations like `x := ""` that are a matter of style.

run:
  # kept from the v1 config, v2 has no timeout by default
  timeout: 10m
  allow-parallel-runners: true
  build-tags:
    - containers_image_openpgp
    - containers_image_storage_stub

issues:
  # report all issues instead of the first 50 per linter and 3 with the same text
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  # Look at this for details: https://golangci-lint.run/docs/linters/
  enable:
    # enabled by default
    - errcheck
    - govet
    - ineffassign
    - staticcheck # includes gosimple and stylecheck since v2
    - unused
    # disabled by default
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - copyloopvar
    - fatcontext
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - err113
    - gomoddirectives
    - goprintffuncname
    - gosec
    - iface
    - importas
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - recvcheck
    - revive
    - sloglint
    # Not planned: conflicts with the K8s API conventions (e.g. fabricatorAPI instead of fabricatorApi) and external
    # APIs field names, 40 issues
    # - tagliatelle
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck

  settings:
    exhaustive:
      check:
        - switch
        - mapliteral # renamed from map in v2
    goconst:
      exclude-types:
        # TODO evaluate detection in function call arguments (v1 and v2 default to skip it): 531 issues
        - Call
        # TODO enable detection in composite literals added in goconst v1.11.0 (v1 had v1.7.1): 55 issues
        - CompositeLit
    gosec:
      excludes:
        # Not planned: unhandled errors duplicate errcheck
        - G104
      config:
        # Allow 0755 instead of 0750 for dirs and chmod as the system dirs and executables have to be world-readable,
        # files written with WriteFile still have to be 0600 (G306)
        G301: "0755"
        G302: "0755"
    gomoddirectives:
      replace-allow-list:
        # our fork for better performance
        - github.com/diskfs/go-diskfs
    iface:
      # all analyzers, only identical is enabled by default
      enable:
        - identical
        - unused
        - opaque
        - unexported
        - unusedmethod
    govet:
      enable-all: true
      disable:
        # Not planned: optimizes struct memory layout at the cost of readable fields order, 128 issues
        - fieldalignment
        # Not planned: reports the idiomatic err shadowing, 229 of 239 issues are about err
        - shadow
    importas:
      no-unaliased: true
      alias:
        - pkg: k8s.io/apimachinery/pkg/types
          alias: ktypes
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: kmetav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: kapierrors
        - pkg: k8s.io/apimachinery/pkg/util/errors
          alias: kerrors
        - pkg: k8s.io/apimachinery/pkg/api/meta
          alias: kmeta
        - pkg: sigs.k8s.io/controller-runtime/pkg/log
          alias: kctrllog
        - pkg: sigs.k8s.io/yaml
          alias: kyaml
        - pkg: sigs.k8s.io/controller-runtime
          alias: kctrl
        - pkg: sigs.k8s.io/controller-runtime/pkg/client
          alias: kclient
    depguard:
      rules:
        main:
          deny:
            - pkg: "github.com/pkg/errors$"
              desc: use stdlib errors package
            # golang.org/x/exp maps and slices are reported by exptostd, but not slog
            - pkg: "golang.org/x/exp/slog$"
              desc: use stdlib slog package
            - pkg: "k8s.io/utils/strings/slices$"
              desc: use stdlib slices or samber/lo package
            - pkg: "sort$"
              desc: use stdlib slices package
            - pkg: gopkg.in/yaml
              desc: use sigs.k8s.io/yaml
            - pkg: go.githedgehog.com/fabric/pkg/agent
              desc: don't import fabric agent package
    predeclared:
      # v1 behavior, v2 defaults to shadow only
      mode:
        - declare
        - shadow
    reassign:
      patterns:
        - ".*"
    recvcheck:
      exclusions:
        # generated for the K8s API types next to their value receiver methods
        - "*.DeepCopy"
        - "*.DeepCopyInto"
    revive:
      # By default, revive will enable only the linting rules that are named in the configuration file.
      # So, it's needed to explicitly enable all required rules here.
      rules:
        # The following rules are recommended https://github.com/mgechev/revive#recommended-configuration
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: package-naming # split out of var-naming in revive v1.15.0, v1 had v1.7.0
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        #
        # Rules in addition to the recommended configuration above.
        #
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: empty-block
        - name: comment-spacings
    sloglint:
      # key-value pairs only, no slog.Attr, as it's what's used everywhere
      kv-only: true
    staticcheck:
      # v1 ran all checks of staticcheck, gosimple and stylecheck while v2 defaults skip ST1000, ST1003, ST1016,
      # ST1020, ST1021 and ST1022 (the ones about comments are still excluded by the comments preset)
      checks:
        - all
        # TODO enable quickfix checks (new in v2): 80 issues, QF1012 x73, QF1003 x6, QF1008 x1
        - -QF*

  exclusions:
    # v1 default, v2 defaults to strict
    generated: lax
    # Default exclusions in v1 (exclude-use-default: true)
    presets:
      # TODO enable: 124 issues about missing or malformed doc comments, staticcheck ST1000/ST1020/ST1021/ST1022
      # (also revive exported and package-comments rules that aren't enabled)
      - comments
      # Not planned: gosec G204 subprocess launched with variable x16 and G304 file inclusion via variable x36 as
      # running commands and reading/writing the user-provided files is what the installer and CLI do (also G103
      # unsafe calls, no issues)
      - common-false-positives
      # TODO enable: 154 issues, errcheck on Close, Flush, os.Remove(All), fmt.Print*, os.(Un)Setenv and std streams
      - std-error-handling
    paths:
      # TODO remove: matches any path containing test, so the tests (18 issues, usetesting is effectively disabled
      # until then) and the release tests in pkg/hhfab (116 issues in testing.go) aren't linted
      - test
      # Not planned: third-party code
      - vendor

formatters:
  enable:
    - gofmt
    # stricter gofmt, set "formatting.gofumpt": true in gopls to get it in the editor
    - gofumpt
    - goimports
    # Not planned: gci, goimports already separates the std imports, enforcing a group for our own imports would
    # either fight the kubebuilder scaffolded files (and drop its +kubebuilder:scaffold:imports marker) or the rest
  exclusions:
    # v1 default, v2 defaults to strict
    generated: lax
    paths:
      # Not planned: third-party code
      - vendor

# Managed by Hedgehog Fabricator: rewritten on upgrade, local changes here are lost.
# Local overrides are not recommended, but if one is needed, put it in {{ .DropInDir }}/*.yaml,
# which k3s merges over this file; use "key+:" there (e.g. "kube-apiserver-arg+:") to append
# to a list set here instead of replacing it.
node-name: "{{ .Name }}"
node-ip: "{{ .NodeIP }}"
flannel-iface: "{{ .FlannelIface }}"
cluster-cidr: "{{ .ClusterSubnet }}"
service-cidr: "{{ .ServiceSubnet }}"
cluster-dns: "{{ .ClusterDNS }}"
kube-proxy-arg:
  - "nodeport-addresses={{ .NodeSubnet }}"
kube-apiserver-arg:
  - "max-requests-inflight={{ .MaxRequestsInflight }}"
  - "max-mutating-requests-inflight={{ .MaxMutatingRequestsInflight }}"
etcd-arg:
  - "quota-backend-bytes={{ .EtcdQuota }}"
write-kubeconfig-mode: "0644"
tls-san:
  {{ range .TLSSAN }}
  - "{{ . }}"
  {{ end }}
secrets-encryption: true
cluster-init: true
